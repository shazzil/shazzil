<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Shasil</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ffffff, #8ab4ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #bdbdbd;
            font-size: 18px;
            line-height: 1.7;
        }

        .contact-box {
            margin-top: 40px;
            padding: 25px;
            border: 1px solid #2a2a2a;
            border-radius: 15px;
            background-color: #0f0f0f;
        }

        .contact-item {
            margin: 15px 0;
            font-size: 20px;
        }

        a {
            color: #8ab4ff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .back-btn {
            display: inline-block;
            margin-top: 35px;
            padding: 12px 28px;
            border: 1px solid white;
            border-radius: 10px;
            color: white;
            transition: 0.3s ease;
        }

        .back-btn:hover {
            background: white;
            color: black;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Contact Shasil</h1>

        <p>
            Cybersecurity-focused Computer Science student passionate about
            threat detection, blue team operations, and security research.
        </p>

        <div class="contact-box">
            <div class="contact-item">
                📧 Email:
                <a href="mailto:shasilpk@gmail.com">
                    shasilpk@gmail.com
                </a>
            </div>

            <div class="contact-item">
                📱 Phone:
                <a href="tel:+919072330895">
                    +91 9072330895
                </a>
            </div>
        </div>

        <a href="index.html" class="back-btn">Back to Portfolio</a>
    </div>

</body>
</html>
